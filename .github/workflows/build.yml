name: Build

on: pull_request

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # also builds shared/dist and installs frontend-v2 (package.json postinstall)
      - run: npm install

      - name: Lint
        run: npm run lint

      - run: npm run build

      - name: Server tests
        run: npm test

      - name: Frontend types
        working-directory: frontend-v2
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend-v2
        run: npx vitest run
