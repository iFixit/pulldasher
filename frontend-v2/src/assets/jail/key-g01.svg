<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Refined neon: one cyan tube traces the whole key, magenta git graph, commit dots in the shaft, a themed backing so it reads on either theme -->
  <defs>
    <filter id="kg01-glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="480"><feGaussianBlur stdDeviation="4"/></filter>
    <path id="kg01-frame" d="M72 24H128A30 30 0 0 1 158 54V114A30 30 0 0 1 128 144H72A30 30 0 0 1 42 114V54A30 30 0 0 1 72 24Z"/>
    <path id="kg01-git" d="M84 56V112M118 70C118 96 84 88 84 104M84 46a10 10 0 1 0 0.01 0M84 112a10 10 0 1 0 0.01 0M118 50a10 10 0 1 0 0.01 0"/>
    <path id="kg01-shaft" d="M92 144V300M108 144V300"/>
    <path id="kg01-bit" d="M92 300V370H114V352H126V370H140V342H150V370H162V300H108"/>
  </defs>
  <g style="fill:var(--jail-rail);stroke:var(--jail-edge)" stroke-width="4" stroke-linejoin="round">
    <rect x="28" y="10" width="144" height="148" rx="40"/>
    <rect x="80" y="150" width="40" height="234" rx="12"/>
    <rect x="112" y="288" width="62" height="96" rx="10"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="bow">
      <g class="jail-glow" filter="url(#kg01-glow)">
        <use style="stroke:var(--jail-bar)" href="#kg01-frame" stroke-width="10"/>
        <use style="stroke:var(--jail-cross)" href="#kg01-git" stroke-width="10"/>
      </g>
      <use style="stroke:var(--jail-bar)" href="#kg01-frame" stroke-width="6"/>
      <use style="stroke:var(--jail-bar-core)" href="#kg01-frame" stroke-width="2"/>
      <use style="stroke:var(--jail-cross)" href="#kg01-git" stroke-width="6"/>
      <use style="stroke:var(--jail-cross-core)" href="#kg01-git" stroke-width="2"/>
    </g>
    <use style="stroke:var(--jail-bar)" class="jail-glow" href="#kg01-shaft" stroke-width="10" filter="url(#kg01-glow)"/>
    <use style="stroke:var(--jail-bar)" href="#kg01-shaft" stroke-width="6"/>
    <use style="stroke:var(--jail-bar-core)" href="#kg01-shaft" stroke-width="2"/>
    <g id="bit">
      <use style="stroke:var(--jail-bar)" class="jail-glow" href="#kg01-bit" stroke-width="10" filter="url(#kg01-glow)"/>
      <use style="stroke:var(--jail-bar)" href="#kg01-bit" stroke-width="6"/>
      <use style="stroke:var(--jail-bar-core)" href="#kg01-bit" stroke-width="2"/>
    </g>
    <g style="fill:var(--jail-cross)" stroke="none">
      <circle cx="100" cy="186" r="4"/><circle cx="100" cy="222" r="4"/><circle cx="100" cy="258" r="4"/>
    </g>
    <g style="fill:var(--jail-cross-core)" stroke="none">
      <circle cx="100" cy="186" r="1.5"/><circle cx="100" cy="222" r="1.5"/><circle cx="100" cy="258" r="1.5"/>
    </g>
  </g>
</svg>
