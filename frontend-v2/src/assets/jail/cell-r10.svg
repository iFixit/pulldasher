<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Cell r10: neon sign cell</title>
  <defs>
    <filter id="cr10-glow" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="920"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="cr10-bars" d="M100 92V708M185 92V708M270 92V708M355 92V708M440 92V708M525 92V708M610 92V708M1015 92V708M1095 92V708"/>
    <path id="cr10-posts" d="M36 92V708M1164 92V708"/>
    <path id="cr10-cross" d="M36 262H650M950 262H1164M36 532H650M950 532H1164"/>
    <path id="cr10-dframe" d="M690 112H910A22 22 0 0 1 932 134V666A22 22 0 0 1 910 688H690A22 22 0 0 1 668 666V134A22 22 0 0 1 690 112Z"/>
    <path id="cr10-dbars" d="M725 112V688M800 112V688M875 112V688"/>
    <path id="cr10-dcross" d="M668 262H932M668 532H932"/>
    <path id="cr10-git" d="M560 24V70M560 56C560 40 590 46 590 32M560 24m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0M560 70m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0M590 28m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0"/>
    <path id="cr10-hole" d="M680 386m-18 0a18 18 0 1 0 36 0a18 18 0 1 0-36 0M672 402L664 450H696L688 402"/>
    <g id="cr10-clip">
      <rect style="fill:var(--jail-hw);stroke:var(--jail-edge)" x="-14" y="-7" width="28" height="14" rx="3" stroke-width="3"/>
    </g>
  </defs>

  <g id="bars" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- tube backing gives the sign its weight; colors are the jail tokens in styles.css -->
    <rect style="fill:var(--jail-rail);stroke:var(--jail-edge)" x="14" y="88" width="44" height="624" rx="10" stroke-width="6"/>
    <rect style="fill:var(--jail-rail);stroke:var(--jail-edge)" x="1142" y="88" width="44" height="624" rx="10" stroke-width="6"/>
    <use style="stroke:var(--jail-edge)" href="#cr10-bars" stroke-width="30"/>
    <use style="stroke:var(--jail-edge)" href="#cr10-cross" stroke-width="30"/>
    <use style="stroke:var(--jail-rail)" href="#cr10-bars" stroke-width="22"/>
    <use style="stroke:var(--jail-rail)" href="#cr10-cross" stroke-width="22"/>
    <!-- cyan bars -->
    <use style="stroke:var(--jail-bar)" class="jail-glow" href="#cr10-bars" stroke-width="12" filter="url(#cr10-glow)"/>
    <use style="stroke:var(--jail-bar)" class="jail-glow" href="#cr10-posts" stroke-width="12" filter="url(#cr10-glow)"/>
    <use style="stroke:var(--jail-bar)" href="#cr10-bars" stroke-width="7"/>
    <use style="stroke:var(--jail-bar)" href="#cr10-posts" stroke-width="7"/>
    <use style="stroke:var(--jail-bar-core)" href="#cr10-bars" stroke-width="2"/>
    <use style="stroke:var(--jail-bar-core)" href="#cr10-posts" stroke-width="2"/>
    <!-- pink crossbars -->
    <use style="stroke:var(--jail-cross)" class="jail-glow" href="#cr10-cross" stroke-width="12" filter="url(#cr10-glow)"/>
    <use style="stroke:var(--jail-cross)" href="#cr10-cross" stroke-width="7"/>
    <use style="stroke:var(--jail-cross-core)" href="#cr10-cross" stroke-width="2"/>
    <!-- tube clips -->
    <g>
      <use href="#cr10-clip" x="100" y="160"/><use href="#cr10-clip" x="185" y="400"/><use href="#cr10-clip" x="270" y="160"/>
      <use href="#cr10-clip" x="355" y="400"/><use href="#cr10-clip" x="440" y="160"/><use href="#cr10-clip" x="525" y="400"/>
      <use href="#cr10-clip" x="610" y="160"/><use href="#cr10-clip" x="1015" y="400"/><use href="#cr10-clip" x="1095" y="160"/>
      <use href="#cr10-clip" x="100" y="640"/><use href="#cr10-clip" x="270" y="640"/><use href="#cr10-clip" x="440" y="640"/>
      <use href="#cr10-clip" x="610" y="640"/><use href="#cr10-clip" x="1095" y="640"/>
    </g>
  </g>

  <!-- top rail: sign backboard -->
  <g id="top-rail">
    <rect style="fill:var(--jail-board);stroke:var(--jail-edge)" x="0" y="0" width="1200" height="92" stroke-width="6"/>
    <rect style="fill:var(--jail-rail-hi)" x="0" y="0" width="1200" height="8"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use style="stroke:var(--jail-cross)" class="jail-glow" href="#cr10-git" stroke-width="10" filter="url(#cr10-glow)"/>
      <use style="stroke:var(--jail-cross)" href="#cr10-git" stroke-width="5"/>
      <use style="stroke:var(--jail-cross-core)" href="#cr10-git" stroke-width="1.6"/>
    </g>
    <text style="fill:var(--jail-door)" class="jail-glow" x="616" y="60" font-family="monospace" font-size="38" font-weight="bold" filter="url(#cr10-glow)">PR JAIL</text>
    <text style="fill:var(--jail-sign);stroke:var(--jail-door)" x="616" y="60" font-family="monospace" font-size="38" font-weight="bold" stroke-width="2">PR JAIL</text>
    <g style="fill:var(--jail-hw);stroke:var(--jail-edge)" stroke-width="3">
      <circle cx="30" cy="46" r="8"/><circle cx="1170" cy="46" r="8"/><circle cx="300" cy="46" r="8"/><circle cx="900" cy="46" r="8"/>
    </g>
  </g>

  <!-- bottom rail: backboard with the transformer -->
  <g id="bottom-rail">
    <rect style="fill:var(--jail-board);stroke:var(--jail-edge)" x="0" y="708" width="1200" height="92" stroke-width="6"/>
    <rect style="fill:var(--jail-edge)" x="0" y="786" width="1200" height="14"/>
    <rect style="fill:var(--jail-hw);stroke:var(--jail-edge)" x="70" y="726" width="150" height="54" rx="6" stroke-width="4"/>
    <g style="stroke:var(--jail-edge)" stroke-width="4" stroke-linecap="round"><path d="M90 742H200M90 754H200M90 766H200"/></g>
    <rect style="fill:var(--jail-door)" x="236" y="742" width="14" height="14" rx="3"/>
    <path style="stroke:var(--jail-edge)" d="M220 753 C300 790 400 720 520 752" fill="none" stroke-width="8" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round">
      <path style="stroke:var(--jail-bar)" class="jail-glow" d="M760 754H1130" stroke-width="10" filter="url(#cr10-glow)" stroke-dasharray="40 24"/>
      <path style="stroke:var(--jail-bar)" d="M760 754H1130" stroke-width="5" stroke-dasharray="40 24"/>
    </g>
  </g>

  <g id="door" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use style="stroke:var(--jail-edge)" href="#cr10-dframe" stroke-width="34"/>
    <use style="stroke:var(--jail-edge)" href="#cr10-dbars" stroke-width="30"/>
    <use style="stroke:var(--jail-edge)" href="#cr10-dcross" stroke-width="30"/>
    <use style="stroke:var(--jail-rail)" href="#cr10-dframe" stroke-width="26"/>
    <use style="stroke:var(--jail-rail)" href="#cr10-dbars" stroke-width="22"/>
    <use style="stroke:var(--jail-rail)" href="#cr10-dcross" stroke-width="22"/>
    <use style="stroke:var(--jail-bar)" class="jail-glow" href="#cr10-dbars" stroke-width="12" filter="url(#cr10-glow)"/>
    <use style="stroke:var(--jail-bar)" href="#cr10-dbars" stroke-width="7"/>
    <use style="stroke:var(--jail-bar-core)" href="#cr10-dbars" stroke-width="2"/>
    <use style="stroke:var(--jail-cross)" class="jail-glow" href="#cr10-dcross" stroke-width="12" filter="url(#cr10-glow)"/>
    <use style="stroke:var(--jail-cross)" href="#cr10-dcross" stroke-width="7"/>
    <use style="stroke:var(--jail-cross-core)" href="#cr10-dcross" stroke-width="2"/>
    <use style="stroke:var(--jail-door)" class="jail-glow" href="#cr10-dframe" stroke-width="14" filter="url(#cr10-glow)"/>
    <use style="stroke:var(--jail-door)" href="#cr10-dframe" stroke-width="8"/>
    <use style="stroke:var(--jail-door-core)" href="#cr10-dframe" stroke-width="2.4"/>
    <!-- hinges -->
    <g style="fill:var(--jail-hw);stroke:var(--jail-edge)" stroke-width="4">
      <rect x="944" y="150" width="36" height="62" rx="8"/>
      <rect x="944" y="588" width="36" height="62" rx="8"/>
    </g>
    <g id="lockplate">
      <rect style="fill:var(--jail-rail);stroke:var(--jail-edge)" x="610" y="326" width="140" height="196" rx="18" stroke-width="8"/>
      <use style="stroke:var(--jail-door)" class="jail-glow" href="#cr10-hole" stroke-width="12" filter="url(#cr10-glow)"/>
      <use style="stroke:var(--jail-door)" href="#cr10-hole" stroke-width="6"/>
      <use style="stroke:var(--jail-door-core)" href="#cr10-hole" stroke-width="2"/>
      <text style="fill:var(--jail-cross)" class="jail-glow" x="680" y="496" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#cr10-glow)">LOCKED</text>
      <text style="fill:var(--jail-cross-core);stroke:var(--jail-cross)" x="680" y="496" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" stroke-width="1.2">LOCKED</text>
      <g style="fill:var(--jail-hw);stroke:var(--jail-edge)" stroke-width="3">
        <circle cx="626" cy="342" r="5"/><circle cx="734" cy="342" r="5"/><circle cx="626" cy="506" r="5"/><circle cx="734" cy="506" r="5"/>
      </g>
    </g>
  </g>
</svg>
