<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Pair for key-g01: refined neon padlock, tubes on a themed backing, magenta commit ring around a bit-shaped keyhole -->
  <defs>
    <filter id="lg01-glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="380" height="480"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="lg01-shackle" d="M94 190V118a56 56 0 0 1 112 0v72"/>
    <path id="lg01-body" d="M78 186H222A34 34 0 0 1 256 220V338A34 34 0 0 1 222 372H78A34 34 0 0 1 44 338V220A34 34 0 0 1 78 186Z"/>
    <path id="lg01-ring" d="M150 225a54 54 0 1 1 -0.01 0"/>
    <path id="lg01-hole" d="M150 250a17 17 0 0 1 11 30V300H170V322H130V300H139V280a17 17 0 0 1 11-30Z"/>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="shackle">
      <use style="stroke:var(--jail-edge)" href="#lg01-shackle" stroke-width="28"/>
      <use style="stroke:var(--jail-rail)" href="#lg01-shackle" stroke-width="22"/>
      <use style="stroke:var(--jail-bar)" class="jail-glow" href="#lg01-shackle" stroke-width="12" filter="url(#lg01-glow)"/>
      <use style="stroke:var(--jail-bar)" href="#lg01-shackle" stroke-width="7"/>
      <use style="stroke:var(--jail-bar-core)" href="#lg01-shackle" stroke-width="2.2"/>
    </g>
    <g id="body">
      <rect style="fill:var(--jail-rail);stroke:var(--jail-edge)" x="28" y="170" width="244" height="218" rx="46" stroke-width="4"/>
      <use style="stroke:var(--jail-bar)" class="jail-glow" href="#lg01-body" stroke-width="12" filter="url(#lg01-glow)"/>
      <use style="stroke:var(--jail-bar)" href="#lg01-body" stroke-width="7"/>
      <use style="stroke:var(--jail-bar-core)" href="#lg01-body" stroke-width="2.2"/>
      <use style="stroke:var(--jail-cross)" class="jail-glow" href="#lg01-ring" stroke-width="8" filter="url(#lg01-glow)"/>
      <use style="stroke:var(--jail-cross)" href="#lg01-ring" stroke-width="3.5"/>
      <g style="fill:var(--jail-rail);stroke:var(--jail-cross)" stroke-width="4">
        <circle cx="150" cy="225" r="7"/><circle cx="197" cy="252" r="7"/><circle cx="197" cy="306" r="7"/>
        <circle cx="150" cy="333" r="7"/><circle cx="103" cy="306" r="7"/><circle cx="103" cy="252" r="7"/>
      </g>
      <g style="fill:var(--jail-cross)" stroke="none"><circle cx="70" cy="208" r="4"/><circle cx="230" cy="208" r="4"/><circle cx="70" cy="350" r="4"/><circle cx="230" cy="350" r="4"/></g>
    </g>
    <g id="keyhole">
      <use style="fill:var(--jail-hole);stroke:var(--jail-bar)" class="jail-glow" href="#lg01-hole" stroke-width="10" filter="url(#lg01-glow)"/>
      <use style="fill:var(--jail-hole);stroke:var(--jail-bar)" href="#lg01-hole" stroke-width="5"/>
      <use style="stroke:var(--jail-bar-core)" href="#lg01-hole" stroke-width="1.6"/>
    </g>
  </g>
</svg>
